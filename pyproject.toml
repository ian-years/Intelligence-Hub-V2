[project]
name = "intelligence-hub-v2"
version = "0.1.0"
description = "本机情报站 V2：四平台采集 + 本地 SQLite + ASR + 孟菲斯风格工作台"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Intelligence Hub V2" }]
keywords = ["douyin", "bilibili", "xiaohongshu", "youtube", "asr", "fastapi"]

dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",          # SSE 支持
    "python-multipart>=0.0.12",     # 表单上传

    # 数据层
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",

    # 配置与校验
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",

    # HTTP 客户端
    "httpx>=0.27",

    # 日志
    "structlog>=24.4",

    # 调度
    "apscheduler>=3.10",

    # 工具
    "python-dateutil>=2.9",
    "typing-extensions>=4.12",
    "anyio>=4.6",
]

[project.optional-dependencies]
# 媒体下载与解析
media = [
    "yt-dlp>=2026.7.4",
    "yt-dlp-ejs>=0.8.0",            # YouTube JS 挑战插件（需 node）
    "curl-cffi>=0.15.0",            # 反爬 HTTP 客户端
    "zhconv>=1.4.3",                # 简繁转换
]
# ASR
asr = [
    "sherpa-onnx>=1.13.8",
    "numpy>=2.2",
]
# CDP 桥
bridge = [
    "playwright>=1.62",
]
# 飞书同步（V2.2）
feishu = []
# 开发工具
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-vcr>=1.0",
    "hypothesis>=6.112",
    "respx>=0.21",                  # mock httpx
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "honcho>=1.1",                  # make dev 多进程
    "types-python-dateutil",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://example.local/intelligence-hub-v2"
Repository = "https://example.local/intelligence-hub-v2"

[project.scripts]
intelligence-hub = "intelligence_hub_v2.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_hub_v2"]

# ============================================================================
# ruff
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["alembic/versions", "frontend", "data"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle + pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "RUF",               # ruff-specific
    "ASYNC",             # async pitfalls
    "BLE",               # 禁止裸 except
    "S",                 # bandit (security)
    "DTZ",               # datetime timezone
    "TCH",               # type-checking imports
    "PTH",               # pathlib over os.path
    "RET",               # return checks
    "ARG",               # unused args
    "PL",                # pylint
    "TRY",               # tryceratops
    "EM",                # error messages
    "G",                 # logging-format
    "ANN",               # annotations
]
ignore = [
    "PLR0913",           # too many args (Pydantic 模型经常多)
    "TRY003",            # long messages outside exception class (我们用 EM 替代)
    "S101",              # assert in tests

    # ---- 本项目特有豁免（每条都有原因，别顺手删） ----
    "RUF001", "RUF002", "RUF003",
    # 全角标点被判"歧义 Unicode"。本仓库的 docstring / 注释 / 用户可见文案一律中文，
    # 110 条里 109 条是这个。开着等于把中文文档全禁了。

    "TC001", "TC003",
    # 不把导入挪进 TYPE_CHECKING 块。Pydantic v2 在建类时求值注解，
    # 挪进去要么得处处补 model_rebuild()，要么运行期 NameError。
    # 省的那点导入时间换不来这个坑。

    "UP046", "UP047",
    # 不用 PEP 695 的 `class X[T]` 语法。Generic[T] 在 Pydantic 泛型模型上
    # 的兼容性更久经考验，target-version 已经是 py312，写法差异不带来任何收益。

    "N818",
    # 异常名不强制 Error 后缀。TaskCancelled / TaskRejected 是
    # docs/specs/task-runner.md §2.5 锁定的契约名（Locked，改动需走 ADR），
    # 命名规范让位于 spec。
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106"]
"tools/**" = ["ANN", "PLR0913"]
"alembic/**" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["intelligence_hub_v2"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================================
# mypy
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_decorators = true
disallow_any_generics = true
extra_checks = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "frontend", "data", "build", "dist"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "sherpa_onnx.*", "apscheduler.*", "zhconv.*", "curl_cffi.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=src/intelligence_hub_v2",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "real_network: 真机测试（CI 跳过，需 cookie + 桥 + Chrome）",
    "slow: >5s 的用例",
    "integration: 集成测试",
    "e2e: 端到端测试（Playwright）",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:yt_dlp.*",
    "ignore::DeprecationWarning:apscheduler.*",
]

[tool.coverage.run]
source = ["src/intelligence_hub_v2"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Alembic（alembic.ini 在仓库根）
# ============================================================================

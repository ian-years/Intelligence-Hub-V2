[project]
name = "intelligence-hub-v2"
version = "0.1.0"
description = "本机情报站 V2：四平台采集 + 本地 SQLite + ASR + 孟菲斯风格工作台"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Intelligence Hub V2" }]
keywords = ["douyin", "bilibili", "xiaohongshu", "youtube", "asr", "fastapi"]

dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",          # SSE 支持
    "python-multipart>=0.0.12",     # 表单上传

    # 数据层
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",

    # 配置与校验
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",

    # HTTP 客户端
    "httpx>=0.27",

    # 日志
    "structlog>=24.4",

    # 调度
    "apscheduler>=3.10",

    # 工具
    "python-dateutil>=2.9",
    "typing-extensions>=4.12",
    "anyio>=4.6",
]

[project.optional-dependencies]
# 媒体下载与解析
media = [
    "yt-dlp>=2026.7.4",
    "yt-dlp-ejs>=0.8.0",            # YouTube JS 挑战插件（需 node）
    "curl-cffi>=0.15.0",            # 反爬 HTTP 客户端
    "zhconv>=1.4.3",                # 简繁转换
]
# ASR
asr = [
    "sherpa-onnx>=1.13.8",
    "numpy>=2.2",
]
# CDP 桥
bridge = [
    "playwright>=1.62",
]
# 飞书同步（V2.2）
feishu = []
# 开发工具
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-vcr>=1.0",
    "hypothesis>=6.112",
    "respx>=0.21",                  # mock httpx
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "honcho>=1.1",                  # make dev 多进程
    "types-python-dateutil",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://example.local/intelligence-hub-v2"
Repository = "https://example.local/intelligence-hub-v2"

[project.scripts]
intelligence-hub = "intelligence_hub_v2.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_hub_v2"]

# ============================================================================
# ruff
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["alembic/versions", "frontend", "data"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle + pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "RUF",               # ruff-specific
    "ASYNC",             # async pitfalls
    "BLE",               # 禁止裸 except
    "S",                 # bandit (security)
    "DTZ",               # datetime timezone
    "TCH",               # type-checking imports
    "PTH",               # pathlib over os.path
    "RET",               # return checks
    "ARG",               # unused args
    "PL",                # pylint
    "TRY",               # tryceratops
    "EM",                # error messages
    "G",                 # logging-format
    "ANN",               # annotations
]
ignore = [
    "PLR0913",           # too many args (Pydantic 模型经常多)
    "TRY003",            # long messages outside exception class (我们用 EM 替代)
    "S101",              # assert in tests

    # ---- 本项目特有豁免（每条都有原因，别顺手删） ----
    "RUF001", "RUF002", "RUF003",
    # 全角标点被判"歧义 Unicode"。本仓库的 docstring / 注释 / 用户可见文案一律中文，
    # 110 条里 109 条是这个。开着等于把中文文档全禁了。

    "TC001", "TC002", "TC003",
    # 不把导入挪进 TYPE_CHECKING 块。Pydantic v2 在建类时求值注解，
    # 挪进去要么得处处补 model_rebuild()，要么运行期 NameError。
    # 省的那点导入时间换不来这个坑。
    # TC002（第三方）与 TC001（首方）是同一件事的另一半 —— Task 3 写存储层时才发现
    # 只豁免两条会留下"一半文件挪、一半不挪"的分裂写法。
    #
    # **别把它读成"TYPE_CHECKING 在本仓库被禁了"**：`storage/db.py` 与
    # `storage/files.py` 把 `AppConfig` 放在 TYPE_CHECKING 块里是**分层**要求
    # （依赖方向 api → core → platforms → infra → storage，storage 不许运行期往上引），
    # 不是导入风格。那两处照旧手写，这条豁免只是不替我们做这个决定。

    "UP046", "UP047",
    # 不用 PEP 695 的 `class X[T]` 语法。Generic[T] 在 Pydantic 泛型模型上
    # 的兼容性更久经考验，target-version 已经是 py312，写法差异不带来任何收益。

    "N818",
    # 异常名不强制 Error 后缀。TaskCancelled / TaskRejected 是
    # docs/specs/task-runner.md §2.5 锁定的契约名（Locked，改动需走 ADR），
    # 命名规范让位于 spec。
]

[tool.ruff.lint.per-file-ignores]
# tests：断言字符串、故意绑 0.0.0.0 的反例、故意抛的假异常、
# 用不上的 fixture/callback 形参 —— 这些在测试里是正常写法，不是缺陷。
"tests/**" = [
    "S101",      # assert
    "S104",      # 测试里就是要验"改成 0.0.0.0 不会被静默改写"
    "S105", "S106",
    "ANN",       # 测试函数的注解由 mypy 不管、ruff 不啰嗦
    "PLR2004",   # 魔法数字（端口、计数）
    "EM",        # 测试里现编的异常消息不需要先赋值给变量
    "TRY",       # tryceratops 那套在测试里没有意义
    "ARG",       # 未使用的 fixture 参数 / lambda 形参
    "ASYNC240",  # 测试里在 async 用例上做 pathlib 阻塞调用是常态（造 fixture 文件），
                 # 换成 to_thread 只会让测试更难读，且没有任何并发要保护。
]
"tools/**" = ["ANN", "PLR0913"]
# infra：这一层是"外部世界的边界"，三条规则在这里都是误报。
"src/intelligence_hub_v2/infra/**" = [
    "ASYNC109",  # 这里的 `timeout=` 是**外部命令的预算**（yt-dlp 一条视频给 900 秒），
                 # 不是 asyncio 调用的超时参数 —— 规则想防的"给 async 函数配 timeout
                 # 而不用 asyncio.wait_for"正好是我们必须做的形状。
    "ASYNC240",  # 事件循环里不许 pathlib 阻塞调用：infra 的 `.is_file()` / `.stat()`
                 # 是"要不要发起子进程"的前置判断，几微秒；换成 to_thread 比原操作更慢，
                 # 还会让"文件在不在"这条线索跨线程漂移。
    "EM101",     # 不许在异常构造里写字面量：本仓库的 PlatformError(platform, stage, message)
                 # 前两位**就是**元数据字面量，EM101 分不出它与消息字面量。
                 # 消息仍然一律先赋给 `msg`（这条纪律照旧，见各文件的 raise 上方）。
]
"src/intelligence_hub_v2/platforms/**" = ["EM101"]
# tasks：handler 里 raise 的 `PlatformError(platform, stage, message)` 与
# `TaskCancelled` 前两位同样是元数据字面量，与上面 infra 那条同一个判据。
# 消息照旧一律先赋给 `msg`（EM101 豁免只放行 platform/stage 这类常量，不是让内联长文案）。
"src/intelligence_hub_v2/tasks/**" = ["EM101"]
# api：FastAPI 的三条官方写法会被这几条误判成坑，逐条豁免并留原因。
"src/intelligence_hub_v2/api/**" = [
    "B008",     # 在参数默认值里写 `Depends(...)` / `Query(...)` 是 FastAPI 的依赖注入惯用法，
                # 不是 B001 想防的"默认值里做有副作用的函数调用"（每次调用都构造对象是框架契约）。
    "PLR0917",  # 路由把 query/body 摊成多个带默认值的形参是 FastAPI 的形状，"参数太多"在这里没意义。
]
# main：uvicorn / apscheduler 故意延迟导入（各自一 import 就拉起一堆子模块/线程），
# 这个代价不该压进模块加载期；`create_app` 在函数里 import apscheduler 是有意的。
"src/intelligence_hub_v2/main.py" = ["PLC0415"]
"alembic/**" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["intelligence_hub_v2"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================================
# mypy
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
# 关掉的原因：下面那条 overrides 覆盖的是**可选 extras**（yt-dlp / sherpa-onnx /
# curl-cffi / zhconv），只装了 dev extras 的环境里 mypy 会认为整段"没用上"，
# 于是每次跑都多一行 note。信号（抓模块名拼错）值不上这个噪音。
disallow_untyped_decorators = true
disallow_any_generics = true
extra_checks = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "frontend", "data", "build", "dist"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "sherpa_onnx.*", "apscheduler.*", "zhconv.*", "curl_cffi.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
# 把仓库根加进 sys.path，让 `tests/` 能当命名空间包用
# （`from tests.contracts._doubles import FakeBridge`）。
# 不加这一行的话只能写 `from _doubles import ...`，那要求整个 tests/ 里
# 文件名不撞车 —— Task 14 要抽一份四个平台共用的契约基类，撞车是迟早的事。
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=src/intelligence_hub_v2",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "real_network: 真机测试（CI 跳过，需 cookie + 桥 + Chrome）",
    "slow: >5s 的用例",
    "integration: 集成测试",
    "e2e: 端到端测试（Playwright）",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:yt_dlp.*",
    "ignore::DeprecationWarning:apscheduler.*",
]

[tool.coverage.run]
source = ["src/intelligence_hub_v2"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Alembic（alembic.ini 在仓库根）
# ============================================================================

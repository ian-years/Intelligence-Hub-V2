douyin:
  enabled: true
  display_name: 抖音
  cookies_file: data/cookies/douyin.com.txt
  videos_per_creator: 30
  rate_limit:
    per_minute: 30
    per_creator_seconds: 2.0
  advanced: {}
  ytdlp_cookies_from_browser: null
  fallback_to_page_play_url: true
bilibili:
  enabled: true
  display_name: B站
  cookies_file: data/cookies/bilibili.com.txt
  videos_per_creator: 30
  rate_limit:
    per_minute: 60
    per_creator_seconds: 1.0
  advanced:
    dash_split_handling: auto
    request_timeout_seconds: 30
    search_fallback_node_playwright: false
  ytdlp_cookies_from_browser: chrome
  external_browser_manifest_path: null
xiaohongshu:
  enabled: false
  display_name: 小红书
  cookies_file: data/cookies/xiaohongshu.com.txt
  videos_per_creator: 30
  rate_limit:
    per_minute: 20
    per_creator_seconds: 3.0
  advanced:
    include_image_notes: true
    sort_notes_by: page_order
    max_images_per_note: 9
  ytdlp_cookies_from_browser: null
  fallback_to_page_play_url: true
youtube:
  enabled: false
  display_name: YouTube
  videos_per_creator: 30
  rate_limit:
    per_minute: 30
    per_creator_seconds: 1.0
  advanced:
    request_timeout_seconds: 60
    format_preference: bv*[height<=1080]+ba/b[height<=1080]
    require_node: true
    node_as_js_runtime: true
    subtitle_languages:
    - zh-Hans
    - zh
    - en
  proxy: null

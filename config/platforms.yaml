# Intelligence Hub V2 — 平台配置
#
# 结构：**顶层 key 就是平台名**（`douyin` / `bilibili` / ...），不再套一层 `platforms:`。
# 原因是 `PUT /api/platforms/{name}/config` 要原子重写整个文件，
# 扁平结构下「文件内容 == 平台配置表」，重写时不会误伤别的段。
# 全局行为（超时、健康检查、Feed 是否显示已禁用平台的历史）在 `app.yaml`。
#
# 改这个文件后**重启服务**才生效；运行时改配置走 `PUT /api/platforms/{name}/config`，
# 服务端会原子写盘 + 热加载 + publish CONFIG_CHANGED 事件（配置层不监听文件变化）。
#
# 顶层出现本构建没注册的平台名 → 启动直接 `ConfigError`，不静默忽略。
# 已注册的平台见 `src/intelligence_hub_v2/platforms/__init__.py` 的
# `PLATFORM_CONFIG_SCHEMAS`；每个平台的完整 schema 见同目录下的 `config.py`，
# 前端配置面板从 `/api/platforms/{name}/schema` 拿 JSON Schema 自动渲染表单。

# ---------------------------------------------------------------------------
# 抖音
# ---------------------------------------------------------------------------
douyin:
  enabled: true
  display_name: "抖音"
  # cookie 文件（Netscape 格式，由 tools/refresh_bridge_cookies.py 从桥导出）。
  # 文件不存在不是错误：导出文件档会被跳过，见 docs/adr/0011。
  cookies_file: "data/cookies/douyin.com.txt"
  # 列表枚举与播放直链兜底都要在已登录浏览器的页面上下文里做
  use_cdp_bridge: true
  # V1 §7.2：抖音对非浏览器客户端做风控，直连 detail 接口恒 403，
  # 缺的是页面那层 a_bogus 签名，yt-dlp 造不出来。
  # 所以"yt-dlp 未拿到媒体，已改用页面播放直链"是**常态而不是故障**。
  media_strategy: "yt_dlp_with_fallback"
  # Windows 上 yt-dlp 读不了 Chrome 的 cookie 库：
  #   Chrome 开着 → Could not copy Chrome cookie database
  #   Chrome 关着 → Failed to decrypt with DPAPI
  # 所以浏览器档默认不给（B站 那边默认 chrome，差别是有意的）。
  # 阶梯顺序**不在这里**，见 docs/adr/0011。
  ytdlp_cookies_from_browser: null
  rate_limit:
    per_minute: 30
    per_creator_seconds: 2                      # 同一博主两条视频之间的间隔
  list_strategy: "browser_scroll"               # 桥内页面 JS 滚动加载
  videos_per_creator: 30
  # yt-dlp 失败时兜底到页面播放直链。**兜底时必须保留 yt-dlp 的失败原文**
  # （MediaArtifact.yt_dlp_error）—— V1 早期一兜底成功就把原文丢掉，
  # 日志只剩"未拿到媒体"，等于没法判断该修什么。
  fallback_to_page_play_url: true
  advanced:
    retry_max: 3
    retry_backoff_seconds: 2
    request_timeout_seconds: 30
    max_video_duration_seconds: null            # null = 不限

# ---------------------------------------------------------------------------
# B站
# ---------------------------------------------------------------------------
bilibili:
  enabled: true
  display_name: "B站"
  cookies_file: "data/cookies/bilibili.com.txt"
  # B站列表枚举走公开 web-interface，媒体走纯 yt-dlp，都不需要桥。
  # 但无 cookie 枚举会随机回 352/412，**同一台机器上一条过一条不过**（V1 §7.15）。
  use_cdp_bridge: false
  # cookie 三档阶梯，顺序排死：导出文件 > --cookies-from-browser > 匿名。
  # 档位差别往往不是"能不能下"，是**画质**：
  #   BV1cSec6tEux 登录档 21 条视频轨/最高 1772p@59.94，匿名 15 条/886p@29.97
  #   BV1ZUYf6JEfo 登录档视频轨 34.6 MB + 音轨 2.5 MB，匿名整片合并才 18.6 MB
  # 所以清单 note 必须写清是哪一档。
  cookie_variant_order:
    - "exported_file"
    - "browser"
    - "anonymous"
  ytdlp_cookies_from_browser: "chrome"          # 置空即跳过浏览器档
  media_strategy: "yt_dlp"
  list_strategy: "api"                          # 公开 web-interface
  # 外部浏览器清单（V1 .agents/skills/bilibili-download 那条路）。
  # 填路径则命中清单的博主跳过内置枚举；生产者是仓库内那份脚本，不是用户级副本（V1 §7.13）。
  external_browser_manifest_path: null
  videos_per_creator: 30
  prefer_subtitles: true                        # 有字幕优先字幕，省一整轮 ASR
  rate_limit:
    per_minute: 60
    per_creator_seconds: 1
  advanced:
    require_login_for_high_quality: true        # 4K/高帧率档需要登录 cookie
    # 未合并 DASH 分片怎么办（V1 §7.21）。转写必须认音频轨：
    # 只 rglob('*.mp4') 会把纯视频流喂给 ffmpeg，报出来的
    # "Output file does not contain any stream" **长得和"ffmpeg 没装"一模一样**，
    # 但方向完全不同 —— 先看错误里有没有这句，有就是分片问题，别去查 PATH。
    dash_split_handling: "auto"                 # auto / merge / keep_split
    retry_max: 3
    retry_backoff_seconds: 2
    request_timeout_seconds: 30
    # 搜索兜底要的是 **Node 版** playwright + NODE_PATH，pip 那个不算数（V1 §7.16）。
    # 依赖链很脏，默认关。开启后检测不到就如实失败，不静默跳过。
    search_fallback_node_playwright: false


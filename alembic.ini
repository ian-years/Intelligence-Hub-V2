# Alembic configuration.
#
# THIS FILE MUST STAY PURE ASCII.
# Alembic reads it with encoding="locale" (alembic/util/compat.py), which on a
# Chinese Windows console is GBK. Any UTF-8 Chinese comment here raises
#   UnicodeDecodeError: 'gbk' codec can't decode byte 0x82 ...
# and every `alembic` command dies before it parses a single option.
# The Chinese rationale lives in alembic/env.py (a .py file, always UTF-8)
# and in docs/lessons.md.
#
# sqlalchemy.url is deliberately NOT set here. env.py resolves the target DB in
# this order:
#   1. config.get_main_option("sqlalchemy.url") when the caller set it
#      explicitly -- SqliteStorage.initialize() and the tests take this path so
#      that "migrate the test DB" can never silently migrate the dev DB.
#   2. env var INTELLIGENCE_HUB_STORAGE__SQLITE_URL
#   3. config/app.yaml -> data.dir + storage.sqlite_file
# Hard-coding the URL here would void the "data/ location is configurable"
# contract (the V1 pitfall 7.12 family: a path decided by a branch nobody reads).

[alembic]
script_location = alembic
prepend_sys_path = src
# `path_separator`, NOT the deprecated `version_path_separator`. Alembic warns
# for both the old name and a missing one -- and pyproject sets
# `filterwarnings = ["error"]`, so a warning here becomes a hard
# MigrationError in every file-backed test while the memory-backed variant
# stays green. Confusing failure mode; keep this key spelled correctly.
path_separator = os
file_template = %%(rev)s_%%(slug)s

# Timestamps rendered by server_default are interpreted as UTC.
timezone = UTC

# post_write_hooks calling ruff are deliberately NOT configured: a missing ruff
# executable makes `alembic revision` fail outright, and "generated migration is
# unformatted" is far less bad than "cannot generate a migration".
# The discipline is manual instead -- after `alembic revision`, run:
#   ruff format alembic/ && ruff check alembic/

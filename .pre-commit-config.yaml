# pre-commit hooks — `pre-commit install` 后每次 commit 自动跑
# 手动全跑：`pre-commit run --all-files`

default_language_version:
  python: python3.12

repos:
  # ---------------------------------------------------------------------
  # 通用文件检查
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: name-tests-test
        args: ['--pytest-test-first']
        # 这个模式要求测试目录里每个 .py 都叫 test_*.py —— 于是 `tests/contracts/_doubles.py`
        # （FakeBridge / FakeYtDlpRunner 那套替身）与 conftest 一直让它红。共享替身模块
        # 带下划线前缀是 pytest 圈的常规写法，不是命名错误。
        exclude: '(^|/)(_|conftest\.py)'

  # ---------------------------------------------------------------------
  # 敏感信息检测（V1 §1.1 那条「downloads/ 永不入库」的兜底）
  # ---------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            uv\.lock|
            .*\.example|
            docs/.*|
            tests/fixtures/.*
          )$

  # ---------------------------------------------------------------------
  # Python: ruff（lint + format）
  # ---------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8  # 必须与 pyproject 里解析出来的 ruff 同版本：0.7.x 解析不了
             # 本项目的 select（TC001 那组在旧版里不是合法 selector），
             # 于是这两个 hook 一直在 exit 2，而 CI 从来没人跑到那一步。
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix, --exit-non-zero-on-fix]
        # ruff ≥0.16 会**吃下任意文本文件**并把里面的 ```python 围栏当代码格式化
        # （实测 0.16.8 对 docs/plans/*.md 报 "1 file reformatted"）。这两个 hook 默认
        # 只按 `types: [text]` 粗筛，于是"跑一次 pre-commit"会悄悄重排 14 份 ADR/spec
        # 的代码样例 —— 而 `ruff format src tests tools` 那道本地门禁碰不到它们。
        # 用 files: 把两者钉死在 Python 文件上，本地与 CI 的处理范围必须一致。
        files: \.pyi?$
      - id: ruff-format
        name: ruff format
        files: \.pyi?$

  # ---------------------------------------------------------------------
  # Python: mypy（strict）
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.5
          - types-PyYAML
          - types-python-dateutil
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        entry: bash -c 'uv run mypy src'

  # ---------------------------------------------------------------------
  # uv lockfile 同步
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: bash -c 'uv lock --check'
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

  # ---------------------------------------------------------------------
  # 前端: ESLint / Prettier / Stylelint（通过 npm，需 frontend/node_modules）
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint . --fix --max-warnings=0'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false

      - id: prettier
        name: prettier
        # 目标 `.` 是必需的：`pass_filenames: false` 时不传文件，prettier 会去读 stdin，
        # 得到一个"No parser and no file path given"。这四个钩子在前端开工前永远
        # Skipped(no files to check)，所以这条坏法一直没暴露（经验 27 的前端版）。
        entry: bash -c 'cd frontend && npx prettier --write --ignore-path .gitignore .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md|html)$
        pass_filenames: false

      - id: stylelint
        name: stylelint
        entry: bash -c 'cd frontend && npx stylelint --fix "**/*.css"'
        language: system
        files: ^frontend/.*\.css$
        pass_filenames: false

      - id: tsc
        name: typescript --noEmit
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  # ---------------------------------------------------------------------
  # 提交信息（Conventional Commits）
  # ---------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, test, chore, perf, ci, build, style, revert]
